name: Publish to Catalog

# Authenticated catalog publish — posts the validated plugin artifact to the
# OrgSDK platform catalog API. This workflow is MANUAL ONLY (workflow_dispatch).
# It never runs automatically on pushes or tags.
#
# Required secrets (for real publish only):
#   ORGSDK_PUBLISH_TOKEN — admin JWT for the platform API (secret)
# Required variables (non-secret):
#   ORGSDK_CATALOG_URL   — platform base URL (e.g. https://app.orgsdk.ai)
#
# The workflow defaults to dry-run. A dry-run does NOT require
# ORGSDK_PUBLISH_TOKEN. Select "false" from the dry_run input to perform a
# real publish — that requires the secret and fails clearly if absent.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (do not POST to catalog)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: catalog-publish
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # oven-sh/setup-bun@v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck + lint + tests
        run: |
          bun run typecheck
          bun run check
          bun run test

      - name: Validate + package
        run: bun run build

      - name: Verify publish token (real publish only)
        if: github.event.inputs.dry_run == 'false'
        env:
          ORGSDK_PUBLISH_TOKEN: ${{ secrets.ORGSDK_PUBLISH_TOKEN }}
        run: |
          if [ -z "$ORGSDK_PUBLISH_TOKEN" ]; then
            echo "::error::ORGSDK_PUBLISH_TOKEN secret is not set. Real catalog publish requires explicit authentication."
            echo "Use dry-run mode or set the secret in the catalog-publish environment."
            exit 1
          fi

      - name: Publish to catalog
        env:
          ORGSDK_PUBLISH_TOKEN: ${{ secrets.ORGSDK_PUBLISH_TOKEN }}
          ORGSDK_CATALOG_URL: ${{ vars.ORGSDK_CATALOG_URL }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "false" ]; then
            FLAGS="--publish"
          else
            FLAGS=""
          fi
          bun run scripts/publish-catalog.ts --url "$ORGSDK_CATALOG_URL" $FLAGS

      # actions/upload-artifact@v4 — keep the staged artifact for audit
      - name: Upload staged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-serper-${{ github.sha }}
          path: dist/
          retention-days: 30
